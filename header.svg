<svg
width="1200"
height="650"
viewBox="0 0 1200 650"
fill="none"
xmlns="http://www.w3.org/2000/svg"
xmlns:xlink="http://www.w3.org/1999/xlink"

>

  <defs>

```
<!-- Soft glow for the sweeping light -->
<linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="white" stop-opacity="0"/>
  <stop offset="45%" stop-color="white" stop-opacity="0.05"/>
  <stop offset="50%" stop-color="white" stop-opacity="0.85"/>
  <stop offset="55%" stop-color="white" stop-opacity="0.05"/>
  <stop offset="100%" stop-color="white" stop-opacity="0"/>
</linearGradient>

<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="18"/>
</filter>

<!-- Keeps the light inside AssetB -->
<clipPath id="bannerClip">
  <rect
    x="50"
    y="105"
    width="1100"
    height="440"
    rx="12"
  />
</clipPath>
```

  </defs>

  <!-- ===================================================== -->

  <!-- ASSET D — STATIC TOP -->

  <!-- ===================================================== -->

<image
 x="100"
 y="20"
 width="1000"
 height="65"
 preserveAspectRatio="xMidYMid meet"
 xlink:href="https://raw.githubusercontent.com/ZenomoStudios/ZenomoStudios/main/assets/AssetD.png"
/>

  <!-- ===================================================== -->

  <!-- ASSET B — MAIN BANNER -->

  <!-- ===================================================== -->

<image
 x="50"
 y="105"
 width="1100"
 height="440"
 preserveAspectRatio="xMidYMid slice"
 xlink:href="https://raw.githubusercontent.com/ZenomoStudios/ZenomoStudios/main/assets/AssetB.webp"
/>

  <!-- ===================================================== -->

  <!-- ANIMATED LIGHT SWEEP -->

  <!-- ===================================================== -->

  <g clip-path="url(#bannerClip)">

```
<!-- Wide soft glow -->
<rect
  x="-500"
  y="80"
  width="350"
  height="490"
  fill="white"
  opacity="0.18"
  filter="url(#glow)"
  transform="skewX(-18)"
>
  <animate
    attributeName="x"
    from="-600"
    to="1450"
    dur="4s"
    repeatCount="indefinite"
  />
</rect>


<!-- Bright central light -->
<rect
  x="-300"
  y="80"
  width="110"
  height="490"
  fill="url(#lightBeam)"
  opacity="0.9"
  transform="skewX(-18)"
>
  <animate
    attributeName="x"
    from="-500"
    to="1450"
    dur="4s"
    repeatCount="indefinite"
  />
</rect>
```

  </g>

  <!-- ===================================================== -->

  <!-- ASSET D — STATIC BOTTOM -->

  <!-- ===================================================== -->

<image
 x="100"
 y="570"
 width="1000"
 height="65"
 preserveAspectRatio="xMidYMid meet"
 xlink:href="https://raw.githubusercontent.com/ZenomoStudios/ZenomoStudios/main/assets/AssetD.png"
/>

</svg>
